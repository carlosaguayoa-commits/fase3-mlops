apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-modelo-fraude
  labels:
    app: fraud-detection-ai
    managed-by: gitops-argocd
    model-version: "v1.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection-ai
  template:
    metadata:
      labels:
        app: fraud-detection-ai
        version: "v1.2.0"
    spec:
      containers:
        - name: contenedor-fraude
          image: ghcr.io/carlosaguayoa-commits/fase3-mlops:v1.2.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
spec:
  selector:
    app: fraud-detection-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
